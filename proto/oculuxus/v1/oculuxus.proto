// Oculuxus helper protocol.
//
// The macOS app launches the Go helper as a child process and talks to it
// over the helper's stdin and stdout. Each direction is a stream of
// protobuf messages, every one prefixed with its length as a varint, the
// framing that both google.golang.org/protobuf (protodelim) and
// apple/swift-protobuf (BinaryDelimited) implement.
//
// The app writes Request messages; the helper writes Response messages.
// Every Request carries an id chosen by the app. The helper answers each
// request with zero or more Progress responses followed by exactly one
// final response: the matching result message, or an Error. Requests run
// concurrently and may be answered out of order. A Cancel request stops
// an in-flight request, which then finishes with an Error of code
// CANCELLED.
//
// Positions and ranges are byte offsets into the UTF-8 text they
// accompany. Lines and columns, where given, are 1-based like go/token.
syntax = "proto3";

package oculuxus.v1;

option go_package = "github.com/herbygillot/oculuxus/helper/pb/oculuxus/v1;oculuxusv1";
option swift_prefix = "Ocx";

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

message Request {
  // Chosen by the app; unique among in-flight requests. Must be non-zero.
  uint64 id = 1;

  oneof body {
    Cancel cancel = 2;
    Shutdown shutdown = 3;
    InfoRequest info = 4;
    OpenProjectRequest open_project = 10;
    CloseProjectRequest close_project = 11;
    ListPackagesRequest list_packages = 12;
    PackageOutlineRequest package_outline = 13;
    DeclarationSourceRequest declaration_source = 14;
    FileSourceRequest file_source = 15;
    ReloadRequest reload = 16;
    SearchRequest search = 17;
    ReferencesRequest references = 18;
    CallHierarchyRequest call_hierarchy = 19;
    HoverRequest hover = 20;
  }
}

message Response {
  // The id of the Request this answers.
  uint64 id = 1;

  oneof body {
    Error error = 2;
    Progress progress = 3;
    Empty empty = 4;
    InfoResponse info = 5;
    OpenProjectResponse open_project = 10;
    ListPackagesResponse list_packages = 12;
    PackageOutlineResponse package_outline = 13;
    DeclarationSourceResponse declaration_source = 14;
    FileSourceResponse file_source = 15;
    ReloadResponse reload = 16;
    SearchResponse search = 17;
    ReferencesResponse references = 18;
    CallHierarchyResponse call_hierarchy = 19;
    HoverResponse hover = 20;
  }
}

message Empty {}

// Cancels the request with the given id. Answered with Empty; the
// cancelled request is answered separately with a CANCELLED Error.
message Cancel {
  uint64 request_id = 1;
}

// Asks the helper to exit after answering with Empty.
message Shutdown {}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CANCELLED = 1;
    INVALID_REQUEST = 2;
    NOT_FOUND = 3;
    NO_PROJECT = 4;
    GO_TOOLCHAIN = 5;
    LOAD_FAILED = 6;
    INTERNAL = 7;
  }
  Code code = 1;
  string message = 2;
}

// A non-final response describing what the helper is doing.
message Progress {
  string message = 1;
}

// ---------------------------------------------------------------------------
// Helper info
// ---------------------------------------------------------------------------

message InfoRequest {}

message InfoResponse {
  uint32 protocol_version = 1;
  string helper_version = 2;
  // Output of `go version` for the Go binary the helper will use.
  string go_version = 3;
  string goroot = 4;
}

// ---------------------------------------------------------------------------
// Projects
// ---------------------------------------------------------------------------

// Opens the folder the user picked. The helper looks for go.work, then
// go.mod, in root_dir and lists the modules it will load. Any open project
// is closed first.
message OpenProjectRequest {
  string root_dir = 1;
  // Optional path to a Go binary chosen by the user. When empty the helper
  // uses the `go` on its PATH.
  string go_binary = 2;
  // Optional build tags, as for `go build -tags`.
  repeated string build_tags = 3;
  // Optional target platform, as GOOS and GOARCH. Empty means the host's
  // (or whatever the environment sets).
  string goos = 4;
  string goarch = 5;
}

message OpenProjectResponse {
  Project project = 1;
}

message Project {
  string root_dir = 1;
  // Path of the go.work or go.mod file that defines the project.
  string config_file = 2;
  bool workspace = 3;
  // The project's own modules (the main module, or every `use` of go.work).
  repeated Module modules = 4;
  string go_version = 5;
}

message Module {
  string path = 1;
  // Empty for the project's own modules.
  string version = 2;
  string dir = 3;
  // True for the project's own modules.
  bool main = 4;
}

message CloseProjectRequest {}

// ---------------------------------------------------------------------------
// Packages
// ---------------------------------------------------------------------------

// Lists every package in the project's build graph: the project's own
// packages plus their transitive dependencies. Only metadata is loaded;
// nothing is type-checked.
message ListPackagesRequest {}

message ListPackagesResponse {
  repeated Package packages = 1;
  // Every module that contributes a package, including the project's own.
  repeated Module modules = 2;
}

enum PackageOrigin {
  PACKAGE_ORIGIN_UNSPECIFIED = 0;
  // Belongs to one of the project's own modules.
  PROJECT = 1;
  // Comes from a dependency module.
  DEPENDENCY = 2;
  // Part of the Go standard library.
  STDLIB = 3;
}

message Package {
  // Identifies the package in later requests. Equal to the import path.
  string id = 1;
  string import_path = 2;
  string name = 3;
  string dir = 4;
  PackageOrigin origin = 5;
  // Path of the module that contains the package; empty for the stdlib.
  string module_path = 6;
  string module_version = 7;
  // Import paths of the packages this one imports directly.
  repeated string imports = 8;
  // Problems `go list` reported for this package.
  repeated string errors = 9;
}

// ---------------------------------------------------------------------------
// Outline
// ---------------------------------------------------------------------------

// Type-checks one package and returns its declarations with signatures
// only. The package stays loaded in the helper until the project is
// closed or the package is reloaded.
message PackageOutlineRequest {
  string package_id = 1;
  // Also load the package's _test.go files. Declarations from them are
  // marked `test`. The external test package ("pkg_test") is its own
  // package; see PackageOutline.external_test_package_id.
  bool include_tests = 2;
}

message PackageOutlineResponse {
  PackageOutline outline = 1;
}

message PackageOutline {
  string package_id = 1;
  string name = 2;
  // The package doc comment, as plain text.
  string doc = 3;
  repeated File files = 4;
  // Top-level declarations in source order. Methods are nested under
  // their receiver type's declaration; struct fields and interface
  // methods under their type's declaration.
  repeated Declaration declarations = 5;
  // Type-check and parse errors, if any. The outline is still returned.
  repeated string errors = 6;
  // With include_tests, the id of the package's external test package
  // (package foo_test in the same directory), if it has one. That id works
  // in PackageOutline and source requests with include_tests set.
  string external_test_package_id = 7;
}

message File {
  // Absolute path.
  string path = 1;
  string name = 2;
  // A _test.go file.
  bool test = 3;
}

enum SymbolKind {
  SYMBOL_KIND_UNSPECIFIED = 0;
  CONST = 1;
  VAR = 2;
  FUNC = 3;
  METHOD = 4;
  STRUCT = 5;
  INTERFACE = 6;
  // A named type that is neither a struct nor an interface.
  TYPE = 7;
  FIELD = 8;
  // A package; only in search results.
  PACKAGE = 9;
}

message Declaration {
  // Identifies the declaration within its package: "Name" at the top
  // level, "Type.Member" for methods and fields.
  string id = 1;
  SymbolKind kind = 2;
  string name = 3;
  bool exported = 4;
  // One line of highlighted, clickable text such as
  // "func (r *Reader) Read(p []byte) (n int, err error)".
  Text signature = 5;
  // The doc comment, as plain text.
  string doc = 6;
  // Where the declaration starts.
  Location location = 7;
  // Fields, interface methods, and methods, in source order.
  repeated Declaration members = 8;
  // For FIELD: the field is an embedded type.
  bool embedded = 9;
  // Declared in a _test.go file.
  bool test = 10;
}

message Location {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
}

// ---------------------------------------------------------------------------
// Source
// ---------------------------------------------------------------------------

// Returns the source of one declaration with highlight spans.
message DeclarationSourceRequest {
  string package_id = 1;
  string declaration_id = 2;
  // As for PackageOutlineRequest.
  bool include_tests = 3;
}

message DeclarationSourceResponse {
  // The declaration's source, including its doc comment.
  Text source = 1;
  // The file and line where `source` begins.
  Location location = 2;
  // The byte offset of `source` in its file, for Hover positions.
  uint32 file_offset = 3;
}

// Returns a whole file with highlight spans.
message FileSourceRequest {
  string package_id = 1;
  // Absolute path, as listed in PackageOutline.files.
  string file = 2;
  // As for PackageOutlineRequest.
  bool include_tests = 3;
}

message FileSourceResponse {
  Text source = 1;
  // Where each top-level declaration and member starts in `source`.
  repeated DeclarationRange declarations = 2;
}

message DeclarationRange {
  string declaration_id = 1;
  Range range = 2;
}

// Highlighted text. Tokens never overlap and are in ascending order.
message Text {
  string text = 1;
  repeated Token tokens = 2;
}

// Byte offsets into the accompanying text; `end` is exclusive.
message Range {
  uint32 start = 1;
  uint32 end = 2;
}

// Modelled on LSP semantic token types.
enum TokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  KEYWORD = 1;
  COMMENT = 2;
  STRING = 3;
  NUMBER = 4;
  OPERATOR = 5;
  // A package name.
  NAMESPACE = 6;
  // A named type that is neither a struct nor an interface.
  TYPE_NAME = 7;
  STRUCT_NAME = 8;
  INTERFACE_NAME = 9;
  TYPE_PARAMETER = 10;
  FUNCTION = 11;
  METHOD_NAME = 12;
  VARIABLE = 13;
  PARAMETER = 14;
  PROPERTY = 15;
  CONSTANT = 16;
  LABEL = 17;
  // A predeclared identifier such as len, int, nil, true.
  BUILTIN = 18;
}

enum TokenModifier {
  TOKEN_MODIFIER_NONE = 0;
  // The token is where the symbol is declared.
  DEFINITION = 1;
  // The symbol is exported.
  EXPORTED = 2;
  // The token is in a doc comment.
  DOCUMENTATION = 4;
}

message Token {
  Range range = 1;
  TokenType type = 2;
  // Bitwise OR of TokenModifier values.
  uint32 modifiers = 3;
  // Set when the token refers to a declaration the app can navigate to.
  SymbolRef target = 4;
}

message SymbolRef {
  string package_id = 1;
  // Empty when the reference is to the package itself.
  string declaration_id = 2;
}

// ---------------------------------------------------------------------------
// Live reload
// ---------------------------------------------------------------------------

// Tells the helper which files changed on disk. The helper drops what it
// loaded for the affected packages, re-indexes them in the background,
// and, when go.mod, go.work or the set of files changed, reloads the
// package list (and the index with it) on the next ListPackages.
message ReloadRequest {
  repeated string changed_files = 1;
}

message ReloadResponse {
  // Packages whose outline or source may have changed.
  repeated string changed_package_ids = 1;
  // True when the app should request the package list again.
  bool package_list_changed = 2;
}

// ---------------------------------------------------------------------------
// Symbol index and search
// ---------------------------------------------------------------------------

// Searches the symbol index: every declaration, method, field and
// interface method, by name. The index is built in the background after
// the first ListPackages, the project's own packages first, then
// dependencies and the standard library. It is built from syntax alone
// (nothing is type-checked) and cached on disk between runs.
//
// A search waits, sending Progress, until the project's packages are
// indexed. Dependencies are searched as far as they are indexed unless
// `wait` is set; `complete` says whether the results cover everything.
message SearchRequest {
  string query = 1;
  // At most this many matches; 0 means 50.
  uint32 limit = 2;
  // Also search dependencies and the standard library.
  bool include_dependencies = 3;
  // Wait until every package in scope is indexed.
  bool wait = 4;
}

message SearchResponse {
  // Best match first.
  repeated SymbolMatch matches = 1;
  // False while packages in scope are still being indexed.
  bool complete = 2;
  // Packages in scope that are indexed, and all packages in scope.
  uint32 indexed_packages = 3;
  uint32 total_packages = 4;
}

message SymbolMatch {
  string package_id = 1;
  string package_name = 2;
  // "Name", or "Type.Member", as in Declaration.id.
  string declaration_id = 3;
  SymbolKind kind = 4;
  // The declaration on one line, without highlighting.
  string signature = 5;
  Location location = 6;
  PackageOrigin origin = 7;
  // The parts of declaration_id that matched the query.
  repeated Range matched = 8;
}

// The on-disk index cache, one file per project. Not sent over the wire.
message SymbolIndex {
  // Bumped when the indexing rules change; older caches are ignored.
  uint32 format = 1;
  // The Go version and build flags the index was built with.
  string build = 2;
  repeated IndexedPackage packages = 3;
}

message IndexedPackage {
  string package_id = 1;
  // A hash of the package's files' names, sizes and modification times.
  bytes fingerprint = 2;
  repeated string files = 3;
  repeated IndexedSymbol symbols = 4;
}

message IndexedSymbol {
  string declaration_id = 1;
  SymbolKind kind = 2;
  string signature = 3;
  // Index into IndexedPackage.files.
  uint32 file = 4;
  uint32 line = 5;
  uint32 column = 6;
}

// ---------------------------------------------------------------------------
// References, call hierarchy and hover
// ---------------------------------------------------------------------------

// A byte offset in a file, as delivered by FileSource, or by
// DeclarationSource plus its file_offset.
message Position {
  string file = 1;
  uint32 offset = 2;
}

// Finds every use of a declaration. The project's own packages are
// type-checked in the background after they are indexed for search, and
// their references are recorded in the index cache. Dependencies and the
// standard library are type-checked only once a request asks for them.
//
// A request waits, sending Progress, until the project's packages are
// indexed, unless `wait` is set, in which case it waits for everything in
// scope. `complete` says whether the results cover the whole scope; the
// app can ask again, with `wait`, for the rest.
message ReferencesRequest {
  oneof at {
    // A declaration from an outline, a search result or a token target.
    SymbolRef symbol = 1;
    // An identifier in a file. A local variable or parameter has no
    // declaration id; its uses within its package are found directly.
    Position position = 2;
  }
  // The package the position's file belongs to. Only with `position`.
  string package_id = 3;
  bool include_dependencies = 4;
  bool wait = 5;
  // At most this many references; 0 means 2000.
  uint32 limit = 6;
}

message ReferencesResponse {
  // The declaration the references point to, resolved from the request.
  SymbolRef symbol = 1;
  // Grouped by package (the project's first), then file, then position.
  repeated Reference references = 2;
  // The number of references found, which exceeds len(references) when
  // the limit cut the list.
  uint32 total = 3;
  bool complete = 4;
  uint32 indexed_packages = 5;
  uint32 total_packages = 6;
}

// One use of a declaration.
message Reference {
  string package_id = 1;
  string package_name = 2;
  PackageOrigin origin = 3;
  Location location = 4;
  // The source line the use is on, without leading whitespace.
  string line_text = 5;
  // The identifier within line_text.
  Range range = 6;
  // The identifier is called.
  bool call = 7;
  // The use goes through a method of an interface the declaration
  // implements; `via` names that interface, such as "io.Reader".
  bool via_interface = 8;
  string via = 9;
  // The declaration in package_id that contains the use: "Name" or
  // "Type.Method" for a function body, the variable's id for an
  // initializer. Empty for a package-level type.
  string enclosing_id = 10;
}

// Lists one level of callers or callees of a function or method. Callers
// come from the reference index, under the same waiting rules as
// ReferencesRequest. Callees come from the function's own body, so they
// never wait on the index.
message CallHierarchyRequest {
  SymbolRef symbol = 1;
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    CALLERS = 1;
    CALLEES = 2;
  }
  Direction direction = 2;
  // For callers: also look in dependencies and the standard library.
  bool include_dependencies = 3;
  bool wait = 4;
}

message CallHierarchyResponse {
  repeated CallHierarchyItem items = 1;
  // As in ReferencesResponse; always complete for callees.
  bool complete = 2;
  uint32 indexed_packages = 3;
  uint32 total_packages = 4;
}

// A caller or callee, with the calls that connect it to the request's
// function.
message CallHierarchyItem {
  // The function at the other end of the calls. Empty declaration_id for
  // a callee without a navigable declaration, such as a local function
  // value or a closure.
  SymbolRef symbol = 1;
  string package_name = 2;
  PackageOrigin origin = 3;
  SymbolKind kind = 4;
  // The function on one line, such as "func (c Circle) Area() float64",
  // or the called expression for a function value.
  string signature = 5;
  // Where the function is declared; absent without a declaration.
  Location location = 6;
  enum CallKind {
    CALL_KIND_UNSPECIFIED = 0;
    // A direct call of a function or method.
    DIRECT = 1;
    // A call through an interface method, whose implementation is not
    // known statically; `via` names the interface.
    VIA_INTERFACE = 2;
    // A call of a function value: a variable, parameter, field or closure.
    FUNCTION_VALUE = 3;
  }
  CallKind call_kind = 7;
  string via = 8;
  // The call sites, inside the caller (for CALLERS, each site's
  // enclosing_id is this item's symbol) or inside the request's function.
  repeated Reference sites = 9;
}

// Describes the identifier at a position, or a declaration, for a hover
// card.
message HoverRequest {
  oneof at {
    SymbolRef symbol = 1;
    Position position = 2;
  }
  // The package the position's file belongs to. Only with `position`.
  string package_id = 3;
  bool include_tests = 4;
}

message HoverResponse {
  // Absent when there is nothing to describe at the position.
  Hover hover = 1;
}

message Hover {
  // What the identifier is: "func", "method", "struct", "interface",
  // "type", "const", "var", "field", "package", "parameter",
  // "local variable", "type parameter", "builtin", "label".
  string kind = 1;
  string name = 2;
  // The declaration on one line, highlighted and clickable.
  Text signature = 3;
  // The package that declares it; empty for builtins and locals.
  string package_id = 4;
  string package_name = 5;
  // The doc comment, as plain text.
  string doc = 6;
  // Where it is declared.
  Location location = 7;
  // The declaration, when the app can navigate to it.
  SymbolRef target = 8;
}

// ---------------------------------------------------------------------------
// Reference index (on disk only)
// ---------------------------------------------------------------------------

// The references in one package, recorded from go/types once the package
// is type-checked in the background. Kept in a separate cache file from
// the symbols, and for dependencies only once they were asked for.
message IndexedReferences {
  string package_id = 1;
  bytes fingerprint = 2;
  repeated string files = 3;
  // The packages referenced; IndexedReference.package indexes this.
  repeated string packages = 4;
  // The ids of the declarations that contain references, in this
  // package; IndexedReference.enclosing indexes this (0 means none).
  repeated string enclosing = 5;
  repeated IndexedReference references = 6;
}

message IndexedReference {
  uint32 package = 1;
  string declaration_id = 2;
  uint32 file = 3;
  uint32 line = 4;
  uint32 column = 5;
  // The identifier's length in bytes.
  uint32 length = 6;
  bool call = 7;
  // The declaration is a method of an interface.
  bool interface_method = 8;
  // 1-based index into IndexedReferences.enclosing; 0 for none.
  uint32 enclosing = 9;
}

message ReferenceIndex {
  uint32 format = 1;
  string build = 2;
  repeated IndexedReferences packages = 3;
}
